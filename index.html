const glyphCache = {};
function glyph(ch){ if(!glyphCache[ch]) glyphCache[ch]=(GL[ch]||GL['?']).split('|'); return glyphCache[ch]; }
function textW(s,sc=1){ return s.length*6*sc-sc; }
function text(ctx,s,x,y,color,sc=1,align='left'){
  s=String(s).toUpperCase();
  if(align==='center') x-=Math.floor(textW(s,sc)/2); else if(align==='right') x-=textW(s,sc);
  ctx.fillStyle=color;
  for(let i=0;i<s.length;i++){ const g=glyph(s[i]);
    for(let r=0;r<7;r++){ const row=g[r]; for(let c=0;c<5;c++) if(row[c]==='#') ctx.fillRect(x+i*6*sc+c*sc,y+r*sc,sc,sc); } }
}
function textShadow(ctx,s,x,y,color,sc=1,align='left',shadow=P.ink){ text(ctx,s,x+sc,y+sc,shadow,sc,align); text(ctx,s,x,y,color,sc,align); }

let AC=null, muted=false;
function beep(f=440,d=0.08,type='square',vol=0.08,slide=0){
  if(muted) return; try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){return;}
  const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=f;

// ---------- Word finding & scoring ----------
function lookup(s){
  const star=s.indexOf('*'); if(star<0) return DICT.has(s)?s:null;
  for(const c of 'ETAOINSRHLDCUMFPGWYBVKXJQZ'){ const r=lookup(s.slice(0,star)+c+s.slice(star+1)); if(r) return r; } return null;
}
function letterVal(c,idx,len){
  if(c==='*') return 5*G.up.wildval;
  let v=VAL[c];
  if(VOWELS.includes(c)) v+=2*G.up.vowelval;
  if('NRTLSD'.includes(c)) v+=1*G.up.commonval;
  if('JQXZK'.includes(c)) v+=5*G.up.rareval;
  if(bossIs('heavy')) v=Math.ceil(v/2);
  if(idx===0||idx===len-1) v*=2; // bookends: first and last letter always count double
  return v;
}
function scoreWord(w,raw,ctxInfo){
  const trig=[]; const held=ctxInfo?ctxInfo.held:0, lastSpin=ctxInfo?ctxInfo.lastSpin:false;
  let chips=0; const vals=[]; for(let i=0;i<raw.length;i++){ const v=letterVal(raw[i],i,raw.length)*3; vals.push(v); chips+=v; } chips+=w.length*w.length*2;
  if(hasJoker('vmove')){ const n=[...w].filter(c=>VOWELS.includes(c)).length; if(n){ chips+=10*n; trig.push({j:'Vowel movement',t:'+'+(10*n)+' CHIPS'}); } }
  if(hasJoker('worm')&&w.length>=5){ chips+=40; trig.push({j:'Bookworm',t:'+40 CHIPS'}); }
  if(hasJoker('zed')){ const n=[...w].filter(c=>'JQXZ'.includes(c)).length; if(n){ chips+=30*n; trig.push({j:'Zed head',t:'+'+(30*n)+' CHIPS'}); } }
  let mult=w.length-1+G.up.mult;
  if(hasJoker('hoard')&&held){ mult+=held; trig.push({j:'Hoarder',t:'+'+held+' MULT'}); }
  if(hasJoker('plural')&&w.endsWith('S')){ mult+=3; trig.push({j:'Pluralist',t:'+3 MULT'}); }
  if(hasJoker('wildlove')&&raw.includes('*')){ mult+=5; trig.push({j:'Star struck',t:'+5 MULT'}); }
  if(hasJoker('lucky')&&G.reels.length>=7){ mult+=2; trig.push({j:'Lucky seven',t:'+2 MULT'}); }
  if(w.length>=5&&G.up.long) mult*=Math.pow(1.5,G.up.long);
  if(hasJoker('allit')&&w[0]===w[w.length-1]){ mult*=2; trig.push({j:'Alliterator',t:'X2 MULT'}); }
  if(hasJoker('tiny')&&w.length===3){ mult*=3; trig.push({j:'Tiny tiger',t:'X3 MULT'}); }
  if(hasJoker('scrab')&&w.length>=7){ mult*=4; trig.push({j:'Scrabbler',t:'X4 MULT'}); }
  if(hasJoker('echo')&&G.seen[w]){ mult*=2; trig.push({j:'Echo',t:'X2 MULT'}); }
  if(hasJoker('last')&&lastSpin){ mult*=2; trig.push({j:'Last call',t:'X2 MULT'}); }
  if(hasJoker('gamble')){ const win=Math.random()<0.5; mult*=win?3:0.5; trig.push({j:'Gambler',t:win?'X3 MULT!':'X0.5 MULT...'}); }
  mult=Math.round(mult*10)/10;

}
function findWords(letters,ctxInfo){
  const n=letters.length, found=[]; const minLen=bossIs('short')?4:2;

  const maximal=found.filter(a=>!found.some(b=>b!==a&&b.i<=a.i&&b.j>=a.j&&(b.j-b.i)>(a.j-a.i)));
  maximal.forEach(m=>Object.assign(m,scoreWord(m.word,m.raw,ctxInfo)));
  maximal.sort((a,b)=>b.total-a.total);
  return maximal;
}

// ---------- Input ----------
const mouse={x:-1,y:-1};
function toLocal(e){ const r=canvas.getBoundingClientRect(); return {x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale}; }
canvas.addEventListener('mousemove',e=>{ Object.assign(mouse,toLocal(e)); });
canvas.addEventListener('mousedown',e=>{ Object.assign(mouse,toLocal(e)); click(); });
canvas.addEventListener('touchstart',e=>{ Object.assign(mouse,toLocal(e.touches[0])); click(); e.preventDefault(); },{passive:false});
function click(){ for(const b of buttons){ if(!b.enabled) continue; if(mouse.x>=b.x&&mouse.x<b.x+b.w&&mouse.y>=b.y&&mouse.y<b.y+b.h){ act(b.id); return; } } }
function act(id){
  if(id==='start'||id==='restart'){ newGame(); beep(500,0.1,'square',0.08); return; }
  if(id==='play') return startBlind();
  if(id==='skip') return skipBlind();
  if(id==='spin') return startSpin();
  if(id.startsWith('unlock')){ const i=+id.slice(6); G.locked[i]=false; beep(400,0.06,'square',0.06); return; }
  if(id.startsWith('lock')){ const i=+id.slice(4); G.locked[i]=true; beep(800,0.06,'square',0.06); burst(reelX(i)+13,132,8,P.blue,1.5,0.4,1); return; }
  if(id.startsWith('sell')){ const i=+id.slice(4); const j=G.jokers[i]; if(!j) return; G.money+=Math.ceil(j.cost/2); G.jokers.splice(i,1); beep(500,0.1,'square',0.08,-200); floatText('+$'+Math.ceil(j.cost/2),W-40,14,P.brass,1); return; }
  if(id.startsWith('buy')){ const k=+id.slice(3); const u=G.shop[k]; if(!u) return; const price=shopPrice(u); if(G.money<price) return sfxNo();
    if(u.kind==='joker'){ if(G.jokers.length>=JOKER_SLOTS) return sfxNo(); G.jokers.push(JOKERS.find(j=>j.id===u.id)); } else G.up[u.id]++;
    G.money-=price; G.shop.splice(k,1); sfxBuy(); burst(W/2,100,30,[P.brass,P.mint],3,0.8,2); doShake(3); floatText('-$'+price,W-30,14,P.pink); return; }
  if(id==='reroll'){ if(G.freeRerolls) G.freeRerolls--; else { if(G.money<G.rerollCost) return sfxNo(); G.money-=G.rerollCost; G.rerollCost+=1; } rollShop(); G.shopT=0; beep(600,0.08,'square',0.06,200); return; }
  if(id==='toshop'){ afterBlindWin(); beep(700,0.1,'square',0.08); return; }
  if(id==='next'){ leaveShop(); beep(700,0.1,'square',0.08); doShake(2); return; }
}
addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault();
    if(G.state==='title'||G.state==='gameover') newGame(); else if(G.state==='play') startSpin(); else if(G.state==='shop') act('next');
    else if(G.state==='select') startBlind(); else if(G.state==='blindwin'&&G.paid>=G.payout.length) act('toshop'); }
  if(e.key==='m'||e.key==='M') muted=!muted; });

// ---------- Loop ----------
newGame(); G.state='title';
function loop(now){ const dt=Math.min(0.05,(now-last)/1000); last=now; update(dt); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script></body></html>
